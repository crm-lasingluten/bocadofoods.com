<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>puente</title>
<body style="font:14px sans-serif">Cargando…
<script>
// Página temporal: envía archivos de esta carpeta a Meta Business Suite (ventana que la abrió).
(async function(){
  var q=new URLSearchParams(location.search), files=(q.get('f')||'').split(',').filter(Boolean);
  if(files[0]==='todo'){files=await (await fetch('lista.json',{cache:'no-store'})).json();}
  document.body.textContent='Enviando '+files.length+' archivos a Meta Business Suite…';
  var target='https://business.facebook.com';
  if(!window.opener){document.body.textContent='Sin ventana de origen';return}
  for(const f of files){
    try{
      const r=await fetch(f,{cache:'no-store'}); const b=await r.arrayBuffer();
      window.opener.postMessage({bocado:1,name:f,type:r.headers.get('content-type'),buf:b},target,[b]);
    }catch(e){window.opener.postMessage({bocado:1,name:f,error:String(e)},target)}
  }
  window.opener.postMessage({bocado:1,done:true},target);
  document.body.textContent='Listo';
})();
</script>
